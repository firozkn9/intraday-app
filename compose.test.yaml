# Ephemeral services for integration tests (optional; tests can also use an
# embedded postgres via pgserver when TEST_DATABASE_URL is unset).
#   docker compose -f compose.test.yaml up -d
#   TEST_DATABASE_URL=postgresql://postgres:test@127.0.0.1:55432/postgres uv run pytest

name: intraday-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
