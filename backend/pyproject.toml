[project]
name = "intraday"
version = "0.1.0"
description = "Autonomous intraday paper-trading system (paper only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "structlog>=24.4",
    "typer>=0.13",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.17",
    "tzdata>=2024.2",
    "httpx>=0.28",
    "websockets>=13",
    "apscheduler>=3.10,<4",
]

[project.scripts]
intraday = "intraday.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.118",
    "respx>=0.21",
    "fakeredis>=2.26",
    "pgserver>=0.1.4",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intraday"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "DTZ", "SIM"]
ignore = ["S101"]  # asserts are fine in tests; production code uses explicit raises

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"migrations/**" = ["E501", "S608"]  # SQL built from module constants only
"src/intraday/cli.py" = ["B008"]  # typer.Option defaults are the typer idiom
"src/intraday/api/**" = ["B008"]  # fastapi Query/Depends defaults are the FastAPI idiom

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["intraday.core.*", "intraday.risk.*", "intraday.trading.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.importlinter]
root_package = "intraday"

[[tool.importlinter.contracts]]
name = "AI, strategies and features cannot reach trading"
type = "forbidden"
source_modules = ["intraday.ai", "intraday.strategies", "intraday.features"]
forbidden_modules = ["intraday.trading"]

[[tool.importlinter.contracts]]
name = "Risk engine is pure: no ai, api, or broker imports"
type = "forbidden"
source_modules = ["intraday.risk"]
forbidden_modules = ["intraday.ai", "intraday.api", "intraday.trading.broker"]

[[tool.importlinter.contracts]]
name = "API never touches the broker, market-data network clients, or engine runtime"
type = "forbidden"
source_modules = ["intraday.api"]
forbidden_modules = ["intraday.trading.broker", "intraday.marketdata.alpaca", "intraday.engine"]
# Backtests (run by the API's worker) use the SimBroker's pure fill functions:
# no network, no credentials.
ignore_imports = ["intraday.backtest.runner -> intraday.trading.broker.sim"]

[[tool.importlinter.contracts]]
name = "Backtests never use network clients"
type = "forbidden"
source_modules = ["intraday.backtest"]
forbidden_modules = ["intraday.marketdata.alpaca", "intraday.engine"]

[[tool.importlinter.contracts]]
name = "Core is the bottom layer"
type = "forbidden"
source_modules = ["intraday.core"]
forbidden_modules = [
    "intraday.db", "intraday.api", "intraday.engine", "intraday.trading",
    "intraday.risk", "intraday.ai", "intraday.strategies", "intraday.features",
    "intraday.marketdata", "intraday.backtest", "intraday.analytics", "intraday.alerts",
]
